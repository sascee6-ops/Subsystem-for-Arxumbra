name: Daylight
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: nightly-2026-11-06
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"
jobs:
  daylight:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - artifact: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          cpu: generic
          extension: ""
          archive: tar.gz
          packages: pkg-config libwayland-dev libxkbcommon-dev
        - artifact: x86_64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          cpu: x86-64-v2
          extension: ""
          archive: tar.gz
          packages: pkg-config libwayland-dev libxkbcommon-dev
        - artifact: AArch64-macOS-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
          runner: macos-15
          target: aarch64-apple-darwin
          cpu: apple-m1
          extension: ""
          archive: tar.gz
          packages: ""
        - artifact: x86_64-macOS-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
          runner: macos-15-intel
          target: x86_64-apple-darwin
          cpu: x86-64-v2
          extension: ""
          archive: tar.gz
          packages: ""
        - artifact: AArch64-Windows-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
          runner: windows-11-arm
          target: aarch64-pc-windows-msvc
          cpu: generic
          extension: .exe
          archive: zip
          packages: ""
        - artifact: x86_64-Windows-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
          runner: windows-2025
          target: x86_64-pc-windows-msvc
          cpu: x86-64-v2
          extension: .exe
          archive: zip
          packages: ""
    env:
      ARTIFACT: ${{ matrix.artifact }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.extension }}
      PACKAGES: ${{ matrix.packages }}
      CPU: ${{ matrix.cpu }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install system packages
      if: matrix.packages != ''
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends ${PACKAGES}
    - name: Install Rust nightly
      run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rust-src --component llvm-tools-preview --target "${TARGET}" --target x86_64-unknown-none --no-self-update
    - name: Build Daylight binary
      run: |
        export "CARGO_TARGET_$(echo "${TARGET}" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-C target-cpu=${CPU} -Z location-detail=none"
        cargo +"${RUST_TOOLCHAIN}" -Zbindeps build --locked --release --quiet \
          --config 'profile.release.opt-level=3' \
          --config 'profile.release.lto="fat"' \
          --config 'profile.release.codegen-units=1' \
          --config 'profile.release.debug=false' \
          --config 'profile.release.debug-assertions=false' \
          --config 'profile.release.overflow-checks=false' \
          --config 'profile.release.incremental=false' \
          --config 'profile.release.strip=true' \
          --config 'profile.release.panic="abort"' \
          --target "${TARGET}" --bin subsystem-for-arxumbra
    - name: Stage executable
      run: |
        mkdir -p "dist/${ARTIFACT}"
        cp "target/${TARGET}/release/subsystem-for-arxumbra${EXT}" "dist/${ARTIFACT}/${ARTIFACT}${EXT}"
    - name: Package archive
      if: matrix.archive == 'tar.gz'
      run: tar -czf "dist/${ARTIFACT}.tar.gz" -C dist "${ARTIFACT}"
    - name: Package archive
      if: matrix.archive == 'zip'
      run: pwsh -NoProfile -Command "Compress-Archive -Path 'dist/${ARTIFACT}/${ARTIFACT}${EXT}' -DestinationPath 'dist/${ARTIFACT}.zip' -CompressionLevel Optimal"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ matrix.artifact }}
        path: dist/${{ matrix.artifact }}.${{ matrix.archive }}
        if-no-files-found: error
        retention-days: 14
