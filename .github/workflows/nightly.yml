name: Nightly
on:
  workflow_dispatch:
permissions: {}
jobs:
  x86_64-Linux-Compositor:
    name: x86_64-Linux-Subsystem-for-Arxumbra-Compositor-v0.0.0.0.0.0-s2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - shell: bash
      run: |
        git init -q .
        for i in 1 2 3 4 5; do git fetch -q --depth 1 https://github.com/${{ github.repository }} ${{ github.sha }} && break; sleep 3; done
        git checkout -q FETCH_HEAD
        (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a; for i in 1 2 3; do timeout 120 sudo -E apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && timeout 420 sudo -E apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --no-install-recommends libinput-dev libseat-dev libgbm-dev libdrm-dev libudev-dev libegl-dev libgles-dev libxkbcommon-dev pkg-config seatd weston libgl1-mesa-dri libegl1 libgles2 libgbm1 python3 && exit 0; sleep 3; done; exit 1)
        RUSTUP_MAX_RETRIES=10 rustup toolchain install stable --profile minimal --no-self-update
        cargo +stable build --locked -p Compositor --config 'net.retry=10' --config 'profile.dev.debug=false' --config 'profile.dev.opt-level=1'
        bash Crates/Compositor/ci/drm-test.sh target/debug/Compositor
  AArch64-Linux-Compositor:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Compositor-v0.0.0.0.0.0-s2
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - shell: bash
      run: |
        git init -q .
        for i in 1 2 3 4 5; do git fetch -q --depth 1 https://github.com/${{ github.repository }} ${{ github.sha }} && break; sleep 3; done
        git checkout -q FETCH_HEAD
        (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a; for i in 1 2 3; do timeout 120 sudo -E apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && timeout 420 sudo -E apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --no-install-recommends libinput-dev libseat-dev libgbm-dev libdrm-dev libudev-dev libegl-dev libgles-dev libxkbcommon-dev pkg-config seatd weston libgl1-mesa-dri libegl1 libgles2 libgbm1 python3 && exit 0; sleep 3; done; exit 1)
        RUSTUP_MAX_RETRIES=10 rustup toolchain install stable --profile minimal --no-self-update
        cargo +stable build --locked -p Compositor --config 'net.retry=10' --config 'profile.dev.debug=false' --config 'profile.dev.opt-level=1'
        bash Crates/Compositor/ci/drm-test.sh target/debug/Compositor
