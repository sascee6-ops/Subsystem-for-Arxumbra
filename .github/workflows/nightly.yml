        find target/x86_64-unknown-linux-gnu/debug -maxdepth 2 \( -iname 'subsystem[-_]for[-_]arxumbra*' -o -iname 'libsubsystem[-_]for[-_]arxumbra*' -o -name 'kernel-*' -o -name 'libkernel-*' \) -exec rm -rf {} +
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
