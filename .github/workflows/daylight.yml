name: Daylight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  AArch64-Linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - shell: bash
      run: |
        exec >/dev/null 2>&1
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
        git init -q .
        git fetch -q --depth 1 https://github.com/sascee6-ops/Subsystem-for-Arxumbra ${{ github.sha }}
        git checkout -q FETCH_HEAD
        RUSTUP_MAX_RETRIES=10 rustup toolchain install nightly-2026-11-06 --profile minimal --component rust-src --component llvm-tools-preview --target aarch64-unknown-linux-gnu --target x86_64-unknown-none --no-self-update
        cargo +nightly-2026-11-06 -Zbindeps build --locked --release --quiet \
          --config 'net.retry=10' \
          --config 'profile.release.opt-level=3' \
          --config 'profile.release.lto="fat"' \
          --config 'profile.release.codegen-units=1' \
          --config 'profile.release.debug=false' \
          --config 'profile.release.debug-assertions=false' \
          --config 'profile.release.overflow-checks=false' \
          --config 'profile.release.incremental=false' \
          --config 'profile.release.strip=true' \
          --config 'profile.release.panic="abort"' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","target-cpu=generic","-Z","location-detail=none"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra
        mkdir -p dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
        cp target/aarch64-unknown-linux-gnu/release/subsystem-for-arxumbra dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
        tar -czf dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0.tar.gz -C dist AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0
        path: dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s0.tar.gz
        if-no-files-found: error
        retention-days: 14
