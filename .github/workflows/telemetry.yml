name: Telemetry
on:
  workflow_dispatch:
    inputs:
      daylight:
        description: Also build and trace the Daylight profile on x86_64-Linux
        type: boolean
        default: false
permissions: {}
jobs:
  AArch64-Linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Telemetry-v0.0.0.0.0.0-s2
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
    - id: toolchain
      shell: bash
      name: Toolchain
      run: |
        git init -q .
        git fetch -q --depth 1 https://github.com/${{ github.repository }} ${{ github.sha }}
        git checkout -q FETCH_HEAD
        mkdir tel
        S0=$(perl -MTime::HiRes=time -e 'printf("%.3f\n",time)')
        (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 xvfb xdotool openbox imagemagick mesa-vulkan-drivers strace jq) > tel/apt.log 2>&1 &
        apt=$!
        d=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-nightly-date.txt)
        echo "date=$d" >> "$GITHUB_OUTPUT"
        RUSTUP_MAX_RETRIES=10 rustup toolchain install nightly-$d --profile minimal --component llvm-tools --component rustc-codegen-cranelift-preview --target aarch64-unknown-linux-gnu --no-self-update > tel/rustup.log 2>&1
        echo "rustup rc=$?"
        wait $apt
        echo "apt rc=$?"
        now() { perl -MTime::HiRes=time -e 'printf("%.3f\n",time)'; }
        dur() { perl -e 'printf("%.1f\n",$ARGV[1]-$ARGV[0])' "$1" "$2"; }
        mark() { echo "$1|$2" >> tel/metrics.txt; }
        S1=$(now)
        mark toolchain_setup_s "$(dur $S0 $S1)"
        mark toolchain "nightly-$d"
        mark profile "Nightly"
        mark target "aarch64-unknown-linux-gnu"
        mark runner "$RUNNER_OS $RUNNER_ARCH image=${ImageOS:-}-${ImageVersion:-}"
        mark cpus "$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo $NUMBER_OF_PROCESSORS)"
        mark memory_mb "$( (free -m 2>/dev/null | awk '/Mem:/{print $2}') || true)$( (sysctl -n hw.memsize 2>/dev/null | awk '{print int($1/1048576)}') || true)"
        mark cpu_model "$( (grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2) || true)$( (lscpu 2>/dev/null | grep -m1 'Model name' | cut -d: -f2) || true)$( (sysctl -n machdep.cpu.brand_string 2>/dev/null) || true)$PROCESSOR_IDENTIFIER"
        mark git_commit "$(git rev-parse --short HEAD)"
    - id: cache
      name: Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: AArch64-Linux-Nightly-${{ steps.toolchain.outputs.date }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/nightly.yml') }}
    - shell: bash
      name: Build
      run: |
        now() { perl -MTime::HiRes=time -e 'printf("%.3f\n",time)'; }
        dur() { perl -e 'printf("%.1f\n",$ARGV[1]-$ARGV[0])' "$1" "$2"; }
        mark() { echo "$1|$2" >> tel/metrics.txt; }
        set +e
        mark cache_hit "${{ steps.cache.outputs.cache-hit }}"
        mark cache_before_registry_mb "$(du -sm ~/.cargo/registry 2>/dev/null | cut -f1)"
        mark cache_before_git_mb "$(du -sm ~/.cargo/git 2>/dev/null | cut -f1)"
        mark cache_before_target_mb "$(du -sm target 2>/dev/null | cut -f1)"
        B0=$(now)
        cargo +nightly-${{ steps.toolchain.outputs.date }} build -Zgit=shallow-deps -Zcodegen-backend --locked --quiet --timings \
          --config 'net.retry=10' \
          --config 'profile.dev.opt-level=0' \
          --config 'profile.dev.lto=false' \
          --config 'profile.dev.codegen-units=256' \
          --config 'profile.dev.debug=false' \
          --config 'profile.dev.debug-assertions=true' \
          --config 'profile.dev.overflow-checks=true' \
          --config 'profile.dev.incremental=false' \
          --config 'profile.dev.rpath=false' \
          --config 'profile.dev.strip="none"' \
          --config 'profile.dev.panic="unwind"' \
          --config 'profile.dev.build-override.opt-level=0' \
          --config 'profile.dev.build-override.codegen-units=256' \
          --config 'profile.dev.build-override.debug=false' \
          --config 'profile.dev.codegen-backend="cranelift"' \
          --config 'profile.dev.package."*".codegen-backend="llvm"' \
          --config 'profile.dev.build-override.codegen-backend="llvm"' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","linker-features=+lld","-C","link-self-contained=+linker","-Z","unstable-options"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra 2> tel/build.stderr
        rc=$?
        B1=$(now)
        mark build_rc "$rc"
        mark build_s "$(dur $B0 $B1)"
        mark build_warnings "$(grep -c '^warning' tel/build.stderr)"
        cp target/aarch64-unknown-linux-gnu/debug/subsystem-for-arxumbra tel/subsystem-for-arxumbra
        find target/aarch64-unknown-linux-gnu/debug -maxdepth 2 \( -iname 'subsystem[-_]for[-_]arxumbra*' -o -name 'kernel-*' -o -name 'libkernel-*' \) -exec rm -rf {} +
        [ "$rc" -eq 0 ] || tail -n 60 tel/build.stderr
    - shell: bash
      name: Static metrics
      env:
        TC: nightly-${{ steps.toolchain.outputs.date }}
        TRIPLE: aarch64-unknown-linux-gnu
        OUT: debug
        BINPATH: tel/subsystem-for-arxumbra
      run: |
        set +e
        mark() { echo "$1|$2" >> tel/metrics.txt; }
        H=$(rustc +$TC -vV | sed -n 's/^host: //p')
        L="$(rustc +$TC --print sysroot)/lib/rustlib/$H/bin"
        mark binary_bytes "$(wc -c < "$BINPATH")"
        mark binary_gzip6_bytes "$(gzip -6 -c "$BINPATH" | wc -c)"
        "$L/llvm-size" "$BINPATH" > tel/sections.txt 2>&1
        case "$RUNNER_OS" in
          macOS) "$L/llvm-objdump" --macho --dylibs-used "$BINPATH" 2>/dev/null | grep -v ':$' | sort -u > tel/dynamic-deps.txt ;;
          *) "$L/llvm-objdump" -p "$BINPATH" 2>/dev/null | grep -E 'NEEDED|DLL Name' | sort -u > tel/dynamic-deps.txt ;;
        esac
        mark dynamic_deps "$(wc -l < tel/dynamic-deps.txt)"
        case "$RUNNER_OS" in
          Windows) ;;
          *)
            "$L/llvm-nm" --print-size --size-sort --demangle "$BINPATH" 2>/dev/null | perl -ne '
              my ($a, $s, $t, $n) = split(/ /, $_, 4);
              next unless defined $n;
              $s = hex($s);
              $n =~ s/^[<&\[(\s_]+//;
              my $c = $n =~ /^([A-Za-z][A-Za-z0-9_]*)(::|$|\s)/ ? $1 : "(other)";
              $c = "std" if $c =~ /^(core|alloc|std|compiler_builtins|hashbrown|gimli|addr2line|miniz_oxide|object|rustc_demangle|std_detect|panic_unwind|panic_abort|unwind)$/;
              $h{$c} += $s;
              $total += $s;
              END {
                foreach (sort { $h{$b} <=> $h{$a} } keys %h) {
                  printf "%10d %5.1f%% %s\n", $h{$_}, 100 * $h{$_} / $total, $_;
                  last if ++$i >= 30;
                }
                printf "%10d total symbol bytes\n", $total;
              }' > tel/symbols-by-crate.txt
            ;;
        esac
        cargo +$TC tree -Zgit=shallow-deps --locked --offline --target $TRIPLE -e normal,build --prefix none -f '{p}' 2> tel/tree.err | sort -u > tel/crates.txt
        mark crates_in_graph "$(wc -l < tel/crates.txt)"
        cargo +$TC tree -Zgit=shallow-deps --locked --offline --target $TRIPLE -d --prefix none -f '{p}' 2>> tel/tree.err | grep -v '^$' | sort -u | head -40 > tel/duplicates.txt
        mark duplicate_crate_versions "$(wc -l < tel/duplicates.txt)"
        mark lock_packages "$(grep -c '^name = ' Cargo.lock)"
        mark src_main_lines "$(wc -l < src/main.rs)"
        mark src_main_bytes "$(wc -c < src/main.rs)"
        mark src_kernel_lines "$(wc -l < kernel/src/lib.rs)"
        mark src_unwrap_calls "$(grep -o 'unwrap' src/main.rs | wc -l)"
        mark cache_registry_mb "$(du -sm ~/.cargo/registry 2>/dev/null | cut -f1)"
        mark cache_git_mb "$(du -sm ~/.cargo/git 2>/dev/null | cut -f1)"
        mark cache_target_mb "$(du -sm target 2>/dev/null | cut -f1)"
        mark target_files "$(find target/$TRIPLE/$OUT -type f 2>/dev/null | wc -l)"
        du -sm target/$TRIPLE/$OUT/* target/$TRIPLE/$OUT/build/* 2>/dev/null | sort -nr | head -14 > tel/target-dirs.txt
    - shell: bash
      name: Runtime
      run: |
        now() { perl -MTime::HiRes=time -e 'printf("%.3f\n",time)'; }
        dur() { perl -e 'printf("%.1f\n",$ARGV[1]-$ARGV[0])' "$1" "$2"; }
        mark() { echo "$1|$2" >> tel/metrics.txt; }
        set +e
        sed -i 's/^    "wayland",$/    "wayland",\n    "x11",/' Cargo.toml
        X0=$(now)
        cargo +nightly-${{ steps.toolchain.outputs.date }} build -Zgit=shallow-deps -Zcodegen-backend --quiet \
          --config 'net.retry=10' \
          --config 'profile.dev.opt-level=0' \
          --config 'profile.dev.lto=false' \
          --config 'profile.dev.codegen-units=256' \
          --config 'profile.dev.debug=false' \
          --config 'profile.dev.debug-assertions=true' \
          --config 'profile.dev.overflow-checks=true' \
          --config 'profile.dev.incremental=false' \
          --config 'profile.dev.rpath=false' \
          --config 'profile.dev.strip="none"' \
          --config 'profile.dev.panic="unwind"' \
          --config 'profile.dev.build-override.opt-level=0' \
          --config 'profile.dev.build-override.codegen-units=256' \
          --config 'profile.dev.build-override.debug=false' \
          --config 'profile.dev.codegen-backend="cranelift"' \
          --config 'profile.dev.package."*".codegen-backend="llvm"' \
          --config 'profile.dev.build-override.codegen-backend="llvm"' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","linker-features=+lld","-C","link-self-contained=+linker","-Z","unstable-options"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra 2> tel/build-x11.stderr
        rc=$?
        X1=$(now)
        mark build_x11_rc "$rc"
        mark build_x11_s "$(dur $X0 $X1)"
        cp target/aarch64-unknown-linux-gnu/debug/subsystem-for-arxumbra tel/bin-x11
        find target/aarch64-unknown-linux-gnu/debug -maxdepth 2 \( -iname 'subsystem[-_]for[-_]arxumbra*' -o -name 'kernel-*' -o -name 'libkernel-*' \) -exec rm -rf {} +
        [ "$rc" -eq 0 ] || { tail -n 60 tel/build-x11.stderr; exit 0; }
        mark x11_binary_bytes "$(wc -c < tel/bin-x11)"
        export BIN=tel/bin-x11
        set +e
        TEL=${TEL:-tel}
        DISP=${DISP:-:99}
        mkdir -p "$TEL/shots"
        now() { perl -MTime::HiRes=time -e 'printf("%.3f\n",time)'; }
        dur() { perl -e 'printf("%.2f\n",$ARGV[1]-$ARGV[0])' "$1" "$2"; }
        mark() { echo "$1|$2" >> "$TEL/metrics.txt"; }
        export DISPLAY=$DISP WGPU_BACKEND=vulkan HOME=/tmp/arxhome
        ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
        export VK_ICD_FILENAMES=$ICD VK_DRIVER_FILES=$ICD
        unset WAYLAND_DISPLAY
        rm -rf "$HOME"
        mkdir -p "$HOME"
        mkdir -p "$HOME/Documents/Archive/Sketches" "$HOME/Documents/Drafts" "$HOME/Documents/Design Notes" "$HOME/Documents/Reference" "$HOME/Documents/Quill" "$HOME/Documents/Zed" "$HOME/Music" "$HOME/Pictures"
        for f in avatar logo Pictures/grid Pictures/img_01 Pictures/img_02 Pictures/img_03 Pictures/img_04 Pictures/img_05 Pictures/img_06 Pictures/img_07 Pictures/img_08 Pictures/img_09 Pictures/img_10 Documents/scene; do
          convert -size 64x64 gradient:'#2a2a2a-#d0d0d0' -rotate $((${#f} * 17 % 360)) -gravity center -crop 48x48+0+0 +repage "$HOME/$f.png"
        done
        for f in Documents/todo.txt Documents/notes.md Documents/Cargo.toml Documents/main.rs Documents/Drafts/d1.txt notes.txt; do
          seq 1 200 > "$HOME/$f"
        done
        head -c 3145728 /dev/zero > "$HOME/Documents/Reference/big.bin"
        head -c 40960 /dev/zero > "$HOME/Documents/report.pdf"
        head -c 20480 /dev/zero > "$HOME/Documents/archive.zip"
        head -c 81920 /dev/zero > "$HOME/Documents/photo.jpg"
        BIN=$(readlink -f "$BIN")
        mark display_driver "$(basename "$ICD")"
        Xvfb "$DISP" -screen 0 1920x1080x24 -nolisten tcp > "$TEL/xvfb.log" 2>&1 &
        XPID=$!
        sleep 2
        openbox > "$TEL/wm.log" 2>&1 &
        WMPID=$!
        sleep 1
        TICK=$(getconf CLK_TCK)
        cpu_ms() { awk -v t="$TICK" '{printf "%d", ($14+$15)*1000/t}' /proc/$APID/stat; }
        rss_thr() { echo "$(awk '/VmRSS/{printf "%d",$2/1024}' /proc/$APID/status)|$(awk '/Threads/{print $2}' /proc/$APID/status)"; }
        launch() {
          L0=$(now)
          "$BIN" > "$TEL/app-$1.log" 2>&1 &
          APID=$!
          WID=""
          for i in $(seq 1 1600); do
            WID=$(xdotool search --name 'Subsystem-for-Arxumbra' 2>/dev/null | head -1)
            [ -n "$WID" ] && break
            sleep 0.025
          done
          L1=$(now)
          for i in $(seq 1 1200); do
            v=$(import -window root -resize 48x27! -colorspace Gray -depth 8 gray:- 2>/dev/null | od -An -tu1 -v | awk '{for(i=1;i<=NF;i++){s+=$i;n++}} END{print (n?s/n:0)}')
            awk -v v="$v" 'BEGIN{exit !(v>3)}' && break
            sleep 0.025
          done
          L2=$(now)
          mark "$1_window_s" "$(dur $L0 $L1)"
          mark "$1_first_frame_s" "$(dur $L0 $L2)"
          mark "$1_first_frame_cpu_ms" "$(cpu_ms)"
          mark "$1_first_frame_rss_mb_threads" "$(rss_thr)"
        }
        shot() {
          sleep "${2:-1.2}"
          f="$TEL/shots/$1.png"
          import -window root "$f"
          echo "$1|$(dur $T0 $(now))|$(cpu_ms)|$(rss_thr)|$(identify -format '%[fx:mean*255]' "$f")|$(md5sum "$f" | cut -c1-12)|$(wc -c < "$f")" >> "$TEL/shots.tsv"
        }
        at() { xdotool mousemove "$1" "$2"; sleep 0.5; }
        tap() { at "$1" "$2"; xdotool click 1; sleep 0.4; }
        region() { convert "$1" -crop 200x30+320+40 +repage -depth 8 gray:- | md5sum | cut -c1-32; }
        hold_esc() {
          import -window root "$TEL/p0.png"
          h0=$(region "$TEL/p0.png")
          xdotool keydown Escape
          for i in $(seq 1 12); do
            sleep 1
            import -window root "$TEL/p.png"
            [ "$(region "$TEL/p.png")" != "$h0" ] && break
          done
          sleep 1
          xdotool keyup Escape
        }
        launch cold
        T0=$L0
        sleep 6
        xdotool windowfocus "$WID"
        sleep 1
        xdotool mousemove 900 900
        shot 01-home 1.5
        tap 140 186; xdotool mousemove 900 700; shot 02-registry 1.5
        tap 656 158; xdotool mousemove 900 700; shot 03-laboratory-empty 1.5
        tap 140 126; xdotool mousemove 1500 900; shot 04-modal-empty 1.5
        tap 696 430; xdotool mousemove 1500 900; shot 05-picker-home 1.5
        tap 960 511; xdotool mousemove 1500 900; shot 06-picker-pictures 1.5
        tap 960 485; xdotool mousemove 1500 900; shot 07-modal-icon-picked 1.5
        tap 960 512; xdotool type --delay 90 "Aurora Engine"; xdotool mousemove 1500 900; shot 08-name-typed 1.2
        tap 960 678; xdotool mousemove 1500 900; shot 09-gui-subchoice 2
        tap 856 748; shot 10-gui-3d 1
        tap 1200 748; xdotool mousemove 1500 900; shot 11-workspace-saved 1.5
        tap 140 126; tap 960 512; xdotool type --delay 90 "Nebula CLI"; tap 960 630; shot 12-cli-form 1.2
        tap 1200 748; xdotool mousemove 1500 900; shot 13-workspace-two 1.5
        tap 140 126; tap 960 512; xdotool type --delay 90 "Orbit OS"; tap 960 582; tap 1200 748
        tap 140 126; tap 960 512; xdotool type --delay 90 "Pixel Forge"; tap 960 678; tap 724 748; tap 1200 748; xdotool mousemove 1500 900; shot 14-workspace-four 1.5
        hold_esc; xdotool mousemove 900 700; shot 15-registry-after-esc 1.5
        tap 656 318; xdotool mousemove 1700 900; shot 16-explorer-home 2
        tap 440 62; xdotool mousemove 500 190; sleep 0.4; shot 17-explorer-new-menu 0.3
        tap 500 108; sleep 0.5
        tap 440 62; sleep 0.4; tap 500 144; sleep 0.5
        tap 440 62; sleep 0.4; tap 500 180; sleep 0.5
        tap 440 62; sleep 0.4; tap 500 226; sleep 0.5
        tap 440 62; sleep 0.4; tap 500 262; sleep 0.5
        tap 440 62; sleep 0.4; tap 500 298; sleep 0.5
        xdotool mousemove 1500 900; shot 18-explorer-created 0.8
        at 900 200; shot 19-explorer-row-hover 0.8
        tap 900 200; xdotool mousemove 1500 900; shot 20-explorer-entered 1
        hold_esc; xdotool mousemove 900 700; shot 21-registry-back 1.5
        tap 656 158; xdotool mousemove 1500 900; sleep 1.5
        tap 570 218; xdotool mousemove 1500 900; shot 22-gui-editor 1.5
        hold_esc; xdotool mousemove 1500 900; shot 23-workspace-back 1.5
        tap 1362 218; xdotool mousemove 1500 900; shot 24-os-editor 1.5
        hold_esc; xdotool mousemove 1500 900; sleep 1.5
        tap 966 218; xdotool mousemove 1500 900; shot 25-cli-editor 1.5
        at 284 294; tap 284 294; xdotool type --delay 70 "Welcome to Arxumbrax"; xdotool key BackSpace; sleep 0.3; shot 26-cli-line-typing 0.6
        xdotool key Return; sleep 0.3; xdotool mousemove 1500 900; shot 27-cli-line-saved 0.8
        tap 312 366; xdotool key BackSpace BackSpace; xdotool type --delay 70 "arx> "; sleep 0.3; xdotool key Return; sleep 0.3; xdotool mousemove 1500 900; shot 28-cli-input-saved 0.8
        hold_esc; xdotool mousemove 1500 900; sleep 1
        tap 1444 218; xdotool mousemove 1500 900; sleep 2; shot 29-os-fullscreen 1
        hold_esc; xdotool mousemove 1500 900; sleep 1.5
        tap 1048 218; xdotool mousemove 1500 900; sleep 2; shot 30-cli-fullscreen 1
        xdotool type --delay 60 "hello world"; xdotool key Return; xdotool type --delay 60 "Subsystem for Arxumbra"; xdotool key Return; xdotool type --delay 60 "abcdefg"; xdotool key BackSpace BackSpace; sleep 0.3; shot 31-cli-typing 0.2
        for n in $(seq 1 40); do xdotool key Return; done; xdotool type --delay 40 "last line after scroll"; sleep 0.5; shot 32-cli-scrolled 0.3
        hold_esc; xdotool mousemove 1500 900; sleep 1.5
        tap 652 218; xdotool mousemove 1500 900; sleep 2; shot 33-gui-fullscreen 1
        hold_esc; xdotool mousemove 900 900; shot 34-registry-final 1.5
        C0=$(cpu_ms)
        sleep 10
        C1=$(cpu_ms)
        mark idle_cpu_ms_10s "$((C1 - C0))"
        mark peak_rss_mb "$(awk '/VmHWM/{printf "%d",$2/1024}' /proc/$APID/status)"
        mark virt_mb "$(awk '/VmSize/{printf "%d",$2/1024}' /proc/$APID/status)"
        mark threads "$(awk '/Threads/{print $2}' /proc/$APID/status)"
        mark open_fds "$(ls /proc/$APID/fd | wc -l)"
        mark minor_faults "$(awk '{print $10}' /proc/$APID/stat)"
        mark major_faults "$(awk '{print $12}' /proc/$APID/stat)"
        mark io_read_bytes "$(awk '/^rchar/{print $2}' /proc/$APID/io)"
        mark io_write_bytes "$(awk '/^wchar/{print $2}' /proc/$APID/io)"
        mark ctx_switches "$(awk '/voluntary_ctxt_switches/{s+=$2} END{print s}' /proc/$APID/status)"
        awk '{print $6}' /proc/$APID/maps | grep '\.so' | sort -u > "$TEL/loaded-libs.txt"
        mark loaded_libs "$(wc -l < "$TEL/loaded-libs.txt")"
        mark total_cpu_ms "$(cpu_ms)"
        mark tour_s "$(dur $T0 $(now))"
        K0=$(now)
        kill -TERM $APID
        wait $APID 2>/dev/null
        mark exit_after_sigterm_s "$(dur $K0 $(now))"
        mark panics "$(cat "$TEL"/app-*.log | grep -c -i panick)"
        launch warm
        T0=$L0
        sleep 6
        xdotool windowfocus "$WID"
        tap 140 186; xdotool mousemove 900 700; sleep 1
        tap 656 158; xdotool mousemove 1500 900; shot 35-persisted-laboratory 2
        tap 966 218; xdotool mousemove 1500 900; shot 36-persisted-cli-editor 1.5
        kill -TERM $APID
        wait $APID 2>/dev/null
        mark panics_after_restart "$(grep -c -i panick "$TEL/app-warm.log")"
        timeout -s INT 10 strace -f -c -o "$TEL/strace-summary.txt" "$BIN" > "$TEL/app-strace.log" 2>&1
        pkill -f "$BIN"
        sleep 1
        montage "$TEL"/shots/*.png -label '%t' -tile 6x -geometry 480x270+4+4 -background '#111111' -fill '#cccccc' "$TEL/contact-sheet.png" 2>/dev/null
        kill $WMPID $XPID 2>/dev/null
        rm -rf "$HOME"
    - shell: bash
      name: Report
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: AArch64-Linux-Subsystem-for-Arxumbra-Telemetry-v0.0.0.0.0.0-s2
      run: |
        rm -f tel/subsystem-for-arxumbra* tel/bin-x11*
        set +e
        {
          echo "# Telemetry $LABEL"
          echo
          echo "## Metrics"
          echo '```'
          awk -F'|' '{printf "%-38s %s\n", $1, $2}' tel/metrics.txt
          echo '```'
          if [ -f tel/shots.tsv ]; then
            echo "## Screens"
            echo '```'
            awk -F'|' '{printf "%-26s t=%7ss cpu+%5dms rss=%4sMB thr=%2s lum=%6.2f md5=%s %8sB\n", $1, $2, ($3 >= p ? $3 - p : $3), $4, $5, $6, $7, $8; p = $3}' tel/shots.tsv
            echo '```'
          fi
          f=$(ls -t target/cargo-timings/cargo-timing-*.html 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            perl -0ne 'print $1 if /const UNIT_DATA = (\[.*?\]);\n/s' "$f" > tel/units.json
            echo "## Slowest build units (seconds)"
            echo '```'
            jq -r '.[] | [(.duration * 10 | round / 10), .name, .version, .mode] | @tsv' tel/units.json | sort -nr | head -15
            echo '```'
            echo "units: $(jq length tel/units.json), cpu seconds: $(jq '[.[].duration] | add | round' tel/units.json), critical wall seconds: $(jq '[.[] | .start + .duration] | max | round' tel/units.json)"
            cp "$f" tel/cargo-timing.html
          fi
          for x in sections.txt symbols-by-crate.txt dynamic-deps.txt target-dirs.txt duplicates.txt tree.err strace-summary.txt loaded-libs.txt; do
            if [ -s "tel/$x" ]; then
              echo "## $x"
              echo '```'
              head -n 40 "tel/$x"
              echo '```'
            fi
          done
          if [ -s tel/build.stderr ]; then
