name: Daylight
on:
  workflow_dispatch:
permissions: {}
jobs:
  AArch64-Linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - id: toolchain
      shell: bash
      run: |
        exec >/dev/null 2>&1
        git init -q .
        git fetch -q --depth 1 https://github.com/sascee6-ops/Subsystem-for-Arxumbra ${{ github.sha }}
        git checkout -q FETCH_HEAD
        (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev) &
        apt=$!
        RUSTUP_MAX_RETRIES=10 rustup toolchain install nightly-2026-11-06 --profile minimal --target aarch64-unknown-linux-gnu --no-self-update
        wait $apt
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: AArch64-Linux-Daylight-nightly-2026-11-06-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/daylight.yml') }}
    - shell: bash
      run: |
        exec >/dev/null 2>&1
        cargo +nightly-2026-11-06 build -Zgit=shallow-deps --locked --release --quiet \
          --config 'net.retry=10' \
          --config 'profile.release.opt-level=3' \
          --config 'profile.release.lto="fat"' \
          --config 'profile.release.codegen-units=1' \
          --config 'profile.release.debug=false' \
          --config 'profile.release.debug-assertions=false' \
          --config 'profile.release.overflow-checks=false' \
          --config 'profile.release.incremental=false' \
          --config 'profile.release.rpath=false' \
          --config 'profile.release.strip=true' \
          --config 'profile.release.panic="abort"' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","target-cpu=generic","-Z","location-detail=none"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra
        mkdir -p dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1
        cp target/aarch64-unknown-linux-gnu/release/subsystem-for-arxumbra dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1
        tar -cf - -C dist AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1 | gzip -1 > dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1.tar.gz
        find target/aarch64-unknown-linux-gnu/release -maxdepth 2 \( -iname 'subsystem[-_]for[-_]arxumbra*' -o -name 'kernel-*' -o -name 'libkernel-*' \) -exec rm -rf {} +
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1
        path: dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s1.tar.gz
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
