name: Nightly
on:
  workflow_dispatch:
permissions: {}
jobs:
  AArch64-Linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - id: toolchain
      shell: bash
      run: |
        exec >/dev/null 2>&1
        git init -q .
        for i in 1 2 3 4 5; do git fetch -q --depth 1 https://github.com/${{ github.repository }} ${{ github.sha }} && break; sleep 3; done
        git checkout -q FETCH_HEAD
        (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a; timeout 120 sudo -E apt-get update -qq && timeout 300 sudo -E apt-get install -y -qq -o Acquire::Retries=3 --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev) &
        apt=$!
        d=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-nightly-date.txt)
        echo "date=$d" >> "$GITHUB_OUTPUT"
        RUSTUP_MAX_RETRIES=10 rustup toolchain install nightly-$d --profile minimal --component rustc-codegen-cranelift-preview --target aarch64-unknown-linux-gnu --no-self-update
        wait $apt || true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: AArch64-Linux-Nightly-${{ steps.toolchain.outputs.date }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/nightly.yml') }}
    - shell: bash
      run: |
        exec >/dev/null 2>&1
        cargo +nightly-${{ steps.toolchain.outputs.date }} build -Zgit=shallow-deps -Zcodegen-backend --locked --quiet \
          --config 'net.retry=10' \
          --config 'profile.dev.opt-level=0' \
          --config 'profile.dev.lto=false' \
          --config 'profile.dev.codegen-units=256' \
          --config 'profile.dev.debug=false' \
          --config 'profile.dev.debug-assertions=true' \
          --config 'profile.dev.overflow-checks=true' \
          --config 'profile.dev.incremental=false' \
          --config 'profile.dev.rpath=false' \
          --config 'profile.dev.strip="none"' \
          --config 'profile.dev.panic="unwind"' \
          --config 'profile.dev.build-override.opt-level=0' \
          --config 'profile.dev.build-override.codegen-units=256' \
          --config 'profile.dev.build-override.debug=false' \
          --config 'profile.dev.codegen-backend="cranelift"' \
          --config 'profile.dev.package."*".codegen-backend="llvm"' \
          --config 'profile.dev.build-override.codegen-backend="llvm"' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","linker-features=+lld","-C","link-self-contained=+linker","-Z","unstable-options"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra
        mkdir -p dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2
        cp target/aarch64-unknown-linux-gnu/debug/subsystem-for-arxumbra dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2
        tar -cf - -C dist AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2 | gzip -1 > dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2.tar.gz
        find target/aarch64-unknown-linux-gnu/debug -maxdepth 2 \( -iname 'subsystem[-_]for[-_]arxumbra*' -o -name 'kernel-*' -o -name 'libkernel-*' \) -exec rm -rf {} +
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2
        path: dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s2.tar.gz
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
