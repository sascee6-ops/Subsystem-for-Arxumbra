name: Probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, exe: "" }
        - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, exe: "" }




    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - shell: bash
      run: |
        T=${{ matrix.triple }}
        E=${{ matrix.exe }}
        d=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-nightly-date.txt)
        N=nightly-$d
        echo "PROBE INFO date=$d nproc=$(nproc 2>/dev/null || sysctl -n hw.ncpu) uname=$(uname -sm)"
        rustup toolchain install $N --profile minimal --target $T --no-self-update > /dev/null 2>&1
        cargo +$N -V
        rustc +$N -vV | grep -E "host|LLVM|release"
        t() { n=$1; shift; if "$@" > o.txt 2>&1; then echo "PROBE OK   $n"; else echo "PROBE FAIL $n :: $(tail -n 4 o.txt | tr '\n' '|' | cut -c1-400)"; fi; }
        cargo init --name h --vcs none h > /dev/null 2>&1
        cd h
        t base cargo +$N build --target $T
        for f in '"-Clinker-features=+lld","-Zunstable-options"' '"-Zlinker-features=+lld","-Zunstable-options"' '"-Clinker-features=+lld","-Clink-self-contained=+linker","-Zunstable-options"' '"-Zlinker-features=+lld","-Clink-self-contained=+linker","-Zunstable-options"' '"-Clink-arg=-fuse-ld=lld"' '"-Clink-arg=-fuse-ld=mold"' '"-Clink-arg=-fuse-ld=gold"'; do
          cargo +$N build --target $T --config "target.$T.rustflags=[$f]" > o.txt 2>&1 && echo "PROBE OK   linker $f" || echo "PROBE FAIL linker $f :: $(grep -m2 -E '^error|error:' o.txt | tr '\n' '|' | cut -c1-300)"
        done
        echo "PROBE INFO linkers: $(which ld.lld lld ld.gold mold ld.bfd clang gcc 2>/dev/null | tr '\n' ' ')"
        cargo +$N build --target $T -v 2>&1 | grep -o 'linker=[^ ]*' | head -2
        cargo +$N rustc --target $T -- --print link-args 2>&1 | tr ' ' '\n' | grep -E "fuse-ld|^cc$|rust-lld|gcc-ld|-B" | head -5
        echo "PROBE INFO tools: $(which xvfb-run xdotool import weston openbox 2>/dev/null | tr '\n' ' ')"
