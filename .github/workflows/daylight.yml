name: Daylight
on:
  workflow_dispatch:
permissions: {}
jobs:
  AArch64-Linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - id: toolchain
      shell: bash
      run: |
        exec >/dev/null 2>&1
        git init -q .
        for i in 1 2 3 4 5; do git fetch -q --depth 1 https://github.com/${{ github.repository }} ${{ github.sha }} && break; sleep 3; done
        git checkout -q FETCH_HEAD
        (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a; for i in 1 2 3; do timeout 120 sudo -E apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && timeout 420 sudo -E apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev && exit 0; sleep 3; done; exit 1) &
        apt=$!
        RUSTUP_MAX_RETRIES=10 rustup toolchain install nightly-2026-11-22 --profile minimal --component rust-src --target aarch64-unknown-linux-gnu --no-self-update
        wait $apt || true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: AArch64-Linux-Daylight-nightly-2026-11-22-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/daylight.yml') }}
    - shell: bash
      run: |
        exec >/dev/null 2>&1
        cargo +nightly-2026-11-22 build -Zgit=shallow-deps -Zbuild-std=std,panic_abort -Ztrim-paths --locked --release --quiet \
          --config 'net.retry=10' \
          --config 'profile.release.opt-level=3' \
          --config 'profile.release.lto="fat"' \
          --config 'profile.release.codegen-units=1' \
          --config 'profile.release.debug=false' \
          --config 'profile.release.debug-assertions=false' \
          --config 'profile.release.overflow-checks=false' \
          --config 'profile.release.incremental=false' \
          --config 'profile.release.rpath=false' \
          --config 'profile.release.strip=true' \
          --config 'profile.release.panic="immediate-abort"' \
          --config 'profile.release.trim-paths="all"' \
          --config 'profile.release.build-override.opt-level=0' \
          --config 'profile.release.build-override.codegen-units=256' \
          --config 'profile.release.build-override.debug=false' \
          --config 'unstable.panic-immediate-abort=true' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","target-cpu=generic","-Z","location-detail=none","-Z","fmt-debug=none","-C","linker-features=+lld","-C","link-self-contained=+linker","-Z","unstable-options"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra
        mkdir -p dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2
        cp target/aarch64-unknown-linux-gnu/release/subsystem-for-arxumbra dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2
        tar -cf - -C dist AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2 | gzip -1 > dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2.tar.gz
        find target/aarch64-unknown-linux-gnu/release -maxdepth 2 \( -iname 'subsystem[-_]for[-_]arxumbra*' -o -name 'kernel-*' -o -name 'libkernel-*' \) -exec rm -rf {} +
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2
        path: dist/AArch64-Linux-Subsystem-for-Arxumbra-Daylight-v0.0.0.0.0.0-s2.tar.gz
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
