name: Probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  x86_64:
    runs-on: ubuntu-24.04
    steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends bolt-20 > /dev/null 2>&1; echo "install rc=$?"; set +o pipefail
        ls /usr/lib/llvm-20/bin | grep -i -E 'bolt|merge-fdata|perf2bolt'
        find /usr/lib -name 'libbolt_rt*' 2>/dev/null || true
        ls /usr/bin | grep -i -E 'bolt|merge-fdata'
        /usr/lib/llvm-20/bin/llvm-bolt --version 2>&1 | head -3 || true
        cat > t.c <<'EOC'
        #include <stdio.h>
        int f(int x){ return x*3+1; }
        int main(int c,char**v){ long s=0; for(int i=0;i<2000000;i++) s+=f(i)%7; printf("%ld\n",s); return 0; }
        EOC
        cc -O1 -no-pie -Wl,-q t.c -o t
        /usr/lib/llvm-20/bin/llvm-bolt t -instrument -instrumentation-file=$PWD/p -instrumentation-no-counters-clear -instrumentation-sleep-time=2 -o t.inst 2>&1 | tail -3
        ./t.inst; ls -l p* 2>&1 | head
        /usr/lib/llvm-20/bin/merge-fdata p > m.fdata; wc -c m.fdata
        /usr/lib/llvm-20/bin/llvm-bolt t -data=p -o t.opt -reorder-blocks=ext-tsp -reorder-functions=hfsort -split-functions -split-all-cold -split-eh -icf=1 -use-gnu-stack -dyno-stats 2>&1 | tail -4
        ./t.opt
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends bolt-20 > /dev/null 2>&1; echo "install rc=$?"; set +o pipefail
        ls /usr/lib/llvm-20/bin | grep -i -E 'bolt|merge-fdata|perf2bolt'
        find /usr/lib -name 'libbolt_rt*' 2>/dev/null || true
        /usr/lib/llvm-20/bin/llvm-bolt --version 2>&1 | head -3 || true
        cat > t.c <<'EOC'
        #include <stdio.h>
        int f(int x){ return x*3+1; }
        int main(int c,char**v){ long s=0; for(int i=0;i<2000000;i++) s+=f(i)%7; printf("%ld\n",s); return 0; }
        EOC
        cc -O1 -no-pie -Wl,-q t.c -o t
        /usr/lib/llvm-20/bin/llvm-bolt t -instrument -instrumentation-file=$PWD/p -instrumentation-no-counters-clear -instrumentation-sleep-time=2 -o t.inst 2>&1 | tail -3
        ./t.inst; ls -l p* 2>&1 | head
        /usr/lib/llvm-20/bin/merge-fdata p > m.fdata; wc -c m.fdata
        /usr/lib/llvm-20/bin/llvm-bolt t -data=p -o t.opt -reorder-blocks=ext-tsp -reorder-functions=hfsort -split-functions -split-all-cold -split-eh -icf=1 -use-gnu-stack -dyno-stats 2>&1 | tail -4
        ./t.opt
