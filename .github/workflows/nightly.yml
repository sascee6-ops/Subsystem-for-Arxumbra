name: Nightly
on:
  workflow_dispatch:
permissions: {}
jobs:
  AArch64-Linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - shell: bash
      run: |
        exec >/dev/null 2>&1
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
        git init -q .
        git fetch -q --depth 1 https://github.com/sascee6-ops/Subsystem-for-Arxumbra ${{ github.sha }}
        git checkout -q FETCH_HEAD
        RUSTUP_MAX_RETRIES=10 rustup toolchain install nightly --profile minimal --component rust-src --component llvm-tools-preview --target aarch64-unknown-linux-gnu --target x86_64-unknown-none --no-self-update
        cargo +nightly -Zbindeps build --locked --quiet \
          --config 'net.retry=10' \
          --config 'profile.dev.opt-level=0' \
          --config 'profile.dev.lto=false' \
          --config 'profile.dev.codegen-units=256' \
          --config 'profile.dev.debug=false' \
          --config 'profile.dev.debug-assertions=true' \
          --config 'profile.dev.overflow-checks=true' \
          --config 'profile.dev.incremental=false' \
          --config 'profile.dev.rpath=false' \
          --config 'profile.dev.strip="none"' \
          --config 'profile.dev.panic="unwind"' \
          --config 'target.aarch64-unknown-linux-gnu.rustflags=["-C","target-cpu=generic"]' \
          --target aarch64-unknown-linux-gnu --bin subsystem-for-arxumbra
        mkdir -p dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1
        cp target/aarch64-unknown-linux-gnu/debug/subsystem-for-arxumbra dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1
        tar -czf dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1.tar.gz -C dist AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1
        path: dist/AArch64-Linux-Subsystem-for-Arxumbra-Nightly-v0.0.0.0.0.0-s1.tar.gz
        if-no-files-found: error
        retention-days: 14
