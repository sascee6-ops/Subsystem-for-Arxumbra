name: Probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  apt:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-24.04, n: 1 }
        - { os: ubuntu-24.04-arm, n: 2 }
        - { os: ubuntu-24.04, n: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - shell: bash
      run: |
        echo "PROBE installed: $(dpkg -s pkg-config libwayland-dev libxkbcommon-dev libwayland-client0 libxkbcommon0 2>&1 | grep -E '^(Package|Status)' | tr '\n' ' ')"
        cat /etc/apt/sources.list.d/*.sources 2>/dev/null | grep -E "^URIs" | sort -u | head -3
        s=$(date +%s)
        timeout 200 sudo apt-get update -o Acquire::Retries=2 2>&1 | tail -n 6
        echo "PROBE update rc=${PIPESTATUS[0]} t=$(( $(date +%s) - s ))s"
        s=$(date +%s)
        timeout 300 sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev 2>&1 | tail -n 5
        echo "PROBE install rc=${PIPESTATUS[0]} t=$(( $(date +%s) - s ))s"
        s=$(date +%s)
        timeout 300 sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 xvfb xdotool openbox imagemagick mesa-vulkan-drivers strace jq 2>&1 | tail -n 5
        echo "PROBE install2 rc=${PIPESTATUS[0]} t=$(( $(date +%s) - s ))s"
