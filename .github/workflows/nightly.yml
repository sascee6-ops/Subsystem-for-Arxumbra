name: Nightly
on:
  workflow_dispatch:
permissions: {}
jobs:
  x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - shell: bash
      run: |
        set +e
        uname -a
        ls -l /dev/dri /dev/uinput /dev/input /dev/tty0 /dev/vga_arbiter 2>&1
        sudo modprobe vkms 2>&1; echo vkms-rc=$?
        sudo modprobe vgem 2>&1; echo vgem-rc=$?
        sudo modprobe uinput 2>&1; echo uinput-rc=$?
        ls -l /dev/dri /dev/uinput 2>&1
        grep -E 'DRM_VKMS|DRM_VGEM|INPUT_UINPUT|CONFIG_DRM=|CONFIG_UHID' /boot/config-$(uname -r)
        find /lib/modules/$(uname -r) \( -name 'vkms*' -o -name 'uinput*' -o -name 'vgem*' \) | head
        lsmod | head -30
        ls /sys/class/drm
        systemctl is-active systemd-logind; loginctl list-sessions 2>&1 | head
        sudo apt-get update -qq 2>&1 | tail -2
        apt-cache policy seatd libseat-dev libinput-dev libgbm-dev libdrm-dev libudev-dev libdisplay-info-dev linux-modules-extra-$(uname -r) | grep -E '^[a-z]|Candidate'
        sudo apt-get install -y -qq linux-modules-extra-$(uname -r) 2>&1 | tail -3
        sudo modprobe vkms 2>&1; echo vkms2-rc=$?
        sudo modprobe uinput 2>&1; echo uinput2-rc=$?
        ls -l /dev/dri /dev/uinput 2>&1
        ls /sys/class/drm
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
    - shell: bash
      run: |
        set +e
        uname -a
        ls -l /dev/dri /dev/uinput /dev/input /dev/tty0 2>&1
        sudo modprobe vkms 2>&1; echo vkms-rc=$?
        sudo modprobe uinput 2>&1; echo uinput-rc=$?
        grep -E 'DRM_VKMS|DRM_VGEM|INPUT_UINPUT|CONFIG_DRM=' /boot/config-$(uname -r)
        find /lib/modules/$(uname -r) \( -name 'vkms*' -o -name 'uinput*' \) | head
        sudo apt-get update -qq 2>&1 | tail -2
        apt-cache policy linux-modules-extra-$(uname -r) | grep Candidate
        sudo apt-get install -y -qq linux-modules-extra-$(uname -r) 2>&1 | tail -3
        sudo modprobe vkms 2>&1; echo vkms2-rc=$?
        ls -l /dev/dri /dev/uinput 2>&1
